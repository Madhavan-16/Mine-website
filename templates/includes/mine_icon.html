{# MiNe line-icon set — 20–24px stroke icons in cyan/navy. Usage: {% from "includes/mine_icon.html" import mine_icon %} {{ mine_icon('book', 20) }} #}
{% macro mine_icon(name, size=20, class='') %}
<span class="mine-icon{% if class %} {{ class }}{% endif %}" style="--mine-icon-size: {{ size }}px" aria-hidden="true">
  <svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    {% if name == 'document' %}
      <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H18v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 7h8M8 11h6M8 15h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'chart' %}
      <path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    {% elif name == 'bulb' %}
      <path d="M9 18h6M10 22h4M12 3a5 5 0 0 0-2 9.5V14h4v-1.5A5 5 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    {% elif name == 'people' %}
      <circle cx="9" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 19c0-3 3-5 5-5s5 2 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="17" cy="8" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M14.5 19c0-2.2 1.5-4 3.5-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'scroll' %}
      <path d="M8 4h8a2 2 0 0 1 2 2v14l-4-3-4 3-4-3-4 3V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    {% elif name == 'layers' %}
      <path d="M12 2 2 7l10 5 10-5-10-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m2 12 10 5 10-5M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    {% elif name == 'book' %}
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    {% elif name == 'briefcase' %}
      <rect x="2" y="7" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" stroke="currentColor" stroke-width="1.6"/>
    {% elif name == 'graduation' %}
      <path d="M22 10 12 5 2 10l10 5 10-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'trophy' %}
      <path d="M8 21h8M12 17v4M7 4h10v3a5 5 0 0 1-10 0V4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 4H4a1 1 0 0 0-1 1v1a3 3 0 0 0 3 3M17 4h3a1 1 0 0 1 1 1v1a3 3 0 0 1-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'map' %}
      <polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21 1 6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 3v15M16 6v15" stroke="currentColor" stroke-width="1.6"/>
    {% elif name == 'trending' %}
      <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17 6 23 6 23 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    {% elif name == 'compass' %}
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="m16 8-4 8-2-4-4-2 8-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    {% elif name == 'scope' %}
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m16.5 16.5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'gear' %}
      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'link' %}
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'refresh' %}
      <path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    {% elif name == 'clipboard' %}
      <rect x="8" y="2" width="8" height="4" rx="1" stroke="currentColor" stroke-width="1.6"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke="currentColor" stroke-width="1.6"/>
    {% elif name == 'target' %}
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>
    {% elif name == 'mail' %}
      <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="m22 7-10 7L2 7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    {% elif name == 'edit' %}
      <path d="M12 20h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    {% elif name == 'folder' %}
      <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    {% elif name == 'chip' %}
      <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 9h.01M15 9h.01M9 15a3 3 0 0 0 6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'tag' %}
      <path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l7.59-7.59a1 1 0 0 0 0-1.41L12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="7" cy="7" r="1.5" stroke="currentColor" stroke-width="1.6"/>
    {% elif name == 'search' %}
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'check' %}
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="m8.5 12.5 2.5 2.5 4.5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    {% elif name == 'x' %}
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="m9 9 6 6M15 9l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'thumbs-up' %}
      <path d="M7 11v10M14 22H7a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.3l1.4-5.1A2 2 0 0 1 14.6 3h.2a1.8 1.8 0 0 1 1.7 2.3L15.5 11H19a2 2 0 0 1 2 2.3l-1 6A2 2 0 0 1 18 22h-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    {% elif name == 'hand' %}
      <path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11.5V5.5a1.5 1.5 0 0 1 3 0V12M14 11V7.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 6-5.5 6H11a5 5 0 0 1-5-5v-3.5a1.5 1.5 0 0 1 3 0V13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    {% elif name == 'badge' %}
      <rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 16.5c1-1.5 2.2-2.2 3.5-2.2s2.5.7 3.5 2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'list' %}
      <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'circle' %}
      <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/>
    {% elif name == 'arrow-right' %}
      <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    {% elif name == 'info' %}
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 10v6M12 7.5h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'teams' %}
      <rect x="9" y="7" width="10" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 18c0-1.8 1.2-3 2.5-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    {% elif name == 'servicenow' %}
      <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% elif name == 'jira' %}
      <path d="M12 3 5.5 9.5 12 16l6.5-6.5L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 8.5 8.8 11.7 12 15l3.2-3.3L12 8.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    {% elif name == 'confluence' %}
      <path d="M6 7c3 0 5 3 9 3s4.5-1.5 4.5-1.5M6 17c3 0 5-3 9-3s4.5 1.5 4.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% else %}
      <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M8 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    {% endif %}
  </svg>
</span>
{% endmacro %}
