{% if current_user and config.get('CHATBOT_ENABLED', True) and not _is_auth_page and (request.endpoint or '') != 'main.landing' %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}?v=25" />
<div
  id="mine-chatbot"
  class="mine-chat"
  data-endpoint="{{ url_for('chatbot.chat') }}"
  data-csrf="{{ csrf_token() }}"
  data-page-endpoint="{{ request.endpoint or '' }}"
  data-user-key="{{ current_user.id }}:{{ current_user.username }}"
  data-bot-icon="{{ url_for('static', filename='img/mine-ai-bot.svg') }}?v=16"
  {% if is_guest %}data-guest="1"{% endif %}
  {% if request.endpoint == 'main.dashboard' %}data-auto-open="1"{% endif %}
>
  <button
    type="button"
    class="mine-chat__launcher"
    id="mine-chat-open"
    aria-expanded="false"
    aria-controls="mine-chat-panel"
    aria-label="Ask MiNe AI"
    title="Ask MiNe AI"
  >
    <span class="mine-chat__launcher-ring" aria-hidden="true"></span>
    <img
      class="mine-chat__launcher-icon"
      src="{{ url_for('static', filename='img/mine-ai-bot.svg') }}?v=16"
      width="40"
      height="40"
      alt=""
      decoding="async"
      draggable="false"
    />
    <span class="mine-chat__tooltip" role="tooltip">Ask MiNe AI</span>
  </button>

  <section class="mine-chat__panel is-closed" id="mine-chat-panel" role="dialog" aria-labelledby="mine-chat-title" aria-modal="false" hidden>
    <header class="mine-chat__header">
      <div class="mine-chat__header-brand">
        <span class="mine-chat__header-avatar" aria-hidden="true">
          <img
            src="{{ url_for('static', filename='img/mine-ai-bot.svg') }}?v=16"
            width="30"
            height="30"
            alt=""
            decoding="async"
            draggable="false"
          />
        </span>
        <div class="mine-chat__header-copy">
          <h2 class="mine-chat__title" id="mine-chat-title">MiNe AI Assistant</h2>
          <p class="mine-chat__status">
            <span class="mine-chat__status-dot" aria-hidden="true"></span>
            Online
          </p>
        </div>
      </div>
      <div class="mine-chat__header-actions">
        <button
          type="button"
          class="mine-chat__explain"
          id="mine-chat-explain"
          aria-label="Explain this page"
          title="Explain this page"
        >
          Explain page
        </button>
        <button
          type="button"
          class="mine-chat__clear"
          id="mine-chat-clear"
          aria-label="Clear chat"
          title="Clear chat"
          hidden
        >
          Clear
        </button>
        <button
          type="button"
          class="mine-chat__expand"
          id="mine-chat-expand"
          aria-label="Expand chat"
          aria-pressed="false"
          title="Expand to full page"
        >
          <svg class="mine-chat__expand-icon mine-chat__expand-icon--grow" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="mine-chat__expand-icon mine-chat__expand-icon--shrink" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden>
            <path d="M10 4H4v6M14 20h6v-6M4 4l7 7M20 20l-7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="mine-chat__close" id="mine-chat-close" aria-label="Close chat" title="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    </header>
    <div class="mine-chat__messages" id="mine-chat-messages" aria-live="polite"></div>
    <form class="mine-chat__form" id="mine-chat-form">
      <label class="visually-hidden" for="mine-chat-input">Your question</label>
      <div class="mine-chat__composer">
        <input
          id="mine-chat-input"
          class="mine-chat__input"
          type="text"
          maxlength="500"
          autocomplete="off"
          placeholder="Ask about Projects, SAP, Snowflake, SIMS, Mining..."
        />
        <button class="mine-chat__send" id="mine-chat-send" type="submit" aria-label="Send message" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4.5 11.5 19 4l-5.5 16-2.2-6.3L4.5 11.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m11.3 13.7 7.7-9.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </form>
  </section>
</div>
<script src="{{ url_for('static', filename='js/chatbot.js') }}?v=25" defer></script>
{% endif %}
