{% extends "base.html" %}
{% block title %}Administrator profile{% endblock %}
{% block content %}
  <div class="card" style="max-width: 720px;">
    <h1>Administrator profile</h1>
    <p class="meta">Signed in as {{ user.display_name }}.</p>
    <table class="table" style="margin-top: 12px;">
      <tbody>
        <tr><th scope="row">Username</th><td>{{ user.username }}</td></tr>
        <tr><th scope="row">Email</th><td>{{ user.email }}</td></tr>
        <tr><th scope="row">Role</th><td><span class="badge">{{ user.role }}</span></td></tr>
      </tbody>
    </table>
    <div class="toolbar" style="margin-top: 18px; flex-wrap: wrap; gap: 8px;">
      <a class="btn btn-primary" href="{{ url_for('admin.moderation') }}">Moderation</a>
      <a class="btn btn-secondary" href="{{ url_for('admin.users') }}">Users</a>
      <a class="btn btn-secondary" href="{{ url_for('admin.settings') }}">Settings</a>
      <a class="btn btn-secondary" href="{{ url_for('admin.analytics') }}">Analytics</a>
    </div>
  </div>
{% endblock %}
